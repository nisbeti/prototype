      var root = document.documentElement;
      root.lang = language;

      root.dataset.arabicFont = get('arabicFont') || 'amiri';
      root.dataset.quranFont = get('quranFont') || 'uthmani';
      if (get('passages') === 'off') {
        root.dataset.hidePassages = '';
      }
    })();
