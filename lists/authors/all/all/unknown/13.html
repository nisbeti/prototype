<script>
    window.Flux = {
        applyAppearance (appearance) {
            let applyDark = () => document.documentElement.classList.add('dark')
            let applyLight = () => document.documentElement.classList.remove('dark')

            if (appearance === 'system') {
                let media = window.matchMedia('(prefers-color-scheme: dark)')

                window.localStorage.removeItem('flux.appearance')

                media.matches ? applyDark() : applyLight()
            } else if (appearance === 'dark') {
                window.localStorage.setItem('flux.appearance', 'dark')

                applyDark()
            } else if (appearance === 'light') {
                window.localStorage.setItem('flux.appearance', 'light')

                applyLight()
            }
        }
    }

    window.Flux.applyAppearance(window.localStorage.getItem('flux.appearance') || 'system')
</script>

        try {
          return localStorage.getItem('bahith.' + key);
        } catch (error) {
          return null;
        }

      var languages = window.BAHITH_I18N || {};

        language = languages[wanted] ? wanted : 'ar';
      }
      var root = document.documentElement;
      root.lang = language;
      root.dir = get('direction') || (languages[language] ? languages[language].dir : 'rtl');
      root.dataset.arabicFont = get('arabic-font') || 'amiri';
      // The fonts every page draws in, fetched at once rather than once the stylesheet asks, so the first page does
      // not move as they arrive. Only over http(s): a font preload is a CORS request, which a page opened from the disk
      // has no origin to make, so there it would only log errors.
      var arabicFonts = {
        amiri: 'amiri-arabic-400-normal',
        sans: 'noto-sans-arabic-arabic-400-normal',
        indopak: 'indopak-nastaleeq',
        uthmani: 'uthmanic-hafs',
      };
      var fonts = /^https?:$/.test(location.protocol)
        ? [
            'inter-latin-400-normal',
            'inter-latin-500-normal',
            arabicFonts[root.dataset.arabicFont] || arabicFonts.amiri,
          ]
        : [];
      fonts.forEach(function (font) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = '';
        link.href = root.dataset.root + 'assets/fonts/' + font + '.woff2';
        document.head.appendChild(link);

      var quranFont = get('quran-font');

      var settle = function (event) {
        var transition = event.viewTransition;
        if (transition) {
          [transition.ready, transition.updateCallbackDone, transition.finished].forEach(function (promise) {
            promise.catch(function () {
              return null;
            });

        x-bind:class="era === 'mutaakhkhirun' ? 'text-zinc-500 dark:text-zinc-300' : 'text-zinc-400 dark:text-zinc-500'"
      >
                  <span class="hidden xl:inline"><span data-t=":from–:to AH" data-r="{&quot;from&quot;:657,&quot;to&quot;:1265}">657–1265 AH</span> ·</span>
                <span
          class="tabular-nums"
          x-text="format(eraCounts['mutaakhkhirun'])"
        ></span>
      </span>
    </button>
      <button
      type="button"
      role="radio"
      x-bind:aria-checked="era === 'muasirun'"
      x-on:click="choose('era', 'muasirun')"
      x-bind:disabled="era !== 'muasirun' && eraCounts['muasirun'] === 0"
      class="shrink-0 rounded-md px-3 py-1.5 text-start text-sm font-medium whitespace-nowrap transition disabled:cursor-default disabled:opacity-50"
      x-bind:class="
        era === 'muasirun'          ? 'bg-white text-zinc-900 shadow-sm dark:bg-zinc-600 dark:text-white'
          : 'text-zinc-600 hover:text-zinc-900 dark:text-zinc-300 dark:hover:text-white'
      "
      data-test="era-option-muasirun"
    >
      Mu&#039;asirun
      <span
        class="block text-xs font-normal"
        x-bind:class="era === 'muasirun' ? 'text-zinc-500 dark:text-zinc-300' : 'text-zinc-400 dark:text-zinc-500'"
      >
                  <span class="hidden xl:inline"><span data-t=":year AH on, or living" data-r="{&quot;year&quot;:1266}">1266 AH on, or living</span> ·</span>
                <span
          class="tabular-nums"
          x-text="format(eraCounts['muasirun'])"
        ></span>
      </span>
    </button>
      <button
      type="button"
      role="radio"
      x-bind:aria-checked="era === 'unknown'"
      x-on:click="choose('era', 'unknown')"
      x-bind:disabled="era !== 'unknown' && eraCounts['unknown'] === 0"
      class="shrink-0 rounded-md px-3 py-1.5 text-start text-sm font-medium whitespace-nowrap transition disabled:cursor-default disabled:opacity-50"
      x-bind:class="
        era === 'unknown'          ? 'bg-white text-zinc-900 shadow-sm dark:bg-zinc-600 dark:text-white'
          : 'text-zinc-600 hover:text-zinc-900 dark:text-zinc-300 dark:hover:text-white'
      "
      data-test="era-option-unknown"
    >
      Unknown
      <span
        class="block text-xs font-normal"
        x-bind:class="era === 'unknown' ? 'text-zinc-500 dark:text-zinc-300' : 'text-zinc-400 dark:text-zinc-500'"
      >
                  <span class="hidden xl:inline">no year ·</span>
                <span
          class="tabular-nums"
          x-text="format(eraCounts['unknown'])"
        ></span>
      </span>
    </button>
  </div>

        <button type="button" class="relative items-center font-medium justify-center whitespace-nowrap disabled:opacity-50 dark:disabled:opacity-50 disabled:cursor-default disabled:pointer-events-none disabled:shadow-none justify-center h-8 text-sm rounded-md gap-2 ps-3 pe-3 inline-flex  bg-transparent hover:bg-zinc-800/5 dark:hover:bg-white/15 text-zinc-800 dark:text-white       ms-auto" data-flux-button="data-flux-button" x-show="hasFilters" x-cloak="x-cloak" x-on:click="clearFilters()" data-test="clear-filters">
        Clear filters
    </button>
      </div>
    
    <div
      class="rounded-xl border border-dashed border-zinc-300 p-10 text-center dark:border-zinc-700"
      x-show="total === 0"
      x-cloak
    >
      <div class="font-medium [:where(&amp;)]:text-zinc-800 [:where(&amp;)]:dark:text-white text-sm [&amp;:has(+[data-flux-subheading])]:mb-2 [[data-flux-subheading]+&amp;]:mt-2" data-flux-heading>No names found</div>
    </div>

    <div
      class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"
      x-show="total > 0"
    >
      <template
        x-for="row in shown"
        :key="row.id"
      >
        <a
          x-bind:href="row.href"
          class="flex items-center justify-between gap-3 rounded-lg border border-zinc-200 px-4 py-3 transition hover:border-zinc-400 hover:bg-zinc-50 dark:border-zinc-700 dark:hover:border-zinc-500 dark:hover:bg-zinc-800"
          data-test="contributor-card"
        >
          <span class="min-w-0">
            <span
              class="block font-medium break-words text-zinc-800 dark:text-white"
              dir="auto"
              x-text="tx(row.name, row.names)"
            ></span>
            <span
              class="block text-[0.8em] font-normal break-words text-zinc-500 dark:text-zinc-400"
              x-show="tx(row.name, row.names) !== row.name"
              data-arabic-original
            >
              <bdi
                lang="ar"
                dir="rtl"
                x-text="row.name"
              ></bdi>
            </span>
          </span>
          <span class="flex shrink-0 flex-col items-end gap-1">
                          <span
                class="inline-flex items-center rounded-md px-1.5 py-1 text-xs font-medium whitespace-nowrap"
                x-bind:class="
                  row.living
                    ? 'bg-emerald-400/15 text-emerald-700 dark:bg-emerald-400/40 dark:text-emerald-200'
                    : 'bg-zinc-400/15 text-zinc-700 dark:bg-zinc-400/40 dark:text-zinc-200'
                "
                x-show="row.died"
                x-text="died(row)"
                data-test="contributor-died"
              ></span>
                        <p class="[:where(&amp;)]:font-normal text-xs [:where(&amp;)]:text-zinc-500 [:where(&amp;)]:dark:text-white/70 whitespace-nowrap" x-text="count('[0,1] :count item|[2,*] :count items', row.count)" data-flux-text ></p>          </span>
        </a>
      </template>
    </div>

    <div
  class="@container flex items-center justify-between gap-3 border-t border-zinc-100 pt-3 dark:border-zinc-700"
  x-show="total > 0"
  data-flux-pagination
>
  <div class="text-xs font-medium whitespace-nowrap text-zinc-500 dark:text-zinc-400">
    Showing
    <span x-text="(page - 1) * perPage + 1"></span>
    to
    <span x-text="Math.min(page * perPage, total)"></span>
    of
    <span x-text="total"></span>
    results
  </div>

  <div
    class="flex items-center rounded-[8px] border border-zinc-200 bg-white p-[1px] dark:border-white/10 dark:bg-white/10"
    x-show="pages > 1"
  >
    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-[6px] text-zinc-400 enabled:hover:bg-zinc-100 enabled:hover:text-zinc-800 disabled:text-zinc-300 sm:size-6 dark:text-zinc-400 dark:enabled:hover:bg-white/20 dark:enabled:hover:text-white dark:disabled:text-zinc-500"
      x-on:click="turn(page - 1)"
      x-bind:disabled="page <= 1"
      aria-label="&amp;laquo; Previous"
    >
      <svg class="shrink-0 [:where(&amp;)]:size-4 rtl:hidden" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
</svg>

              <svg class="shrink-0 [:where(&amp;)]:size-4 hidden rtl:inline" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
</svg>

            </button>

    <template
      x-for="(link, index) in pageLinks"
      :key="index"
    >
      <div class="hidden @[40rem]:contents">
        <template x-if="link === '...'">
          <div
            class="flex size-6 cursor-default items-center justify-center rounded-[6px] text-xs font-medium text-zinc-400 dark:text-zinc-400"
          >
            ...
          </div>
        </template>
        <template x-if="link === page">
          <div
            aria-current="page"
            class="flex h-6 cursor-default items-center justify-center rounded-[6px] px-2 text-xs font-medium text-zinc-800 dark:text-white"
            x-text="link"
          ></div>
        </template>
        <template x-if="link !== '...' && link !== page">
          <button
            type="button"
            class="h-6 rounded-[6px] px-2 text-xs font-medium text-zinc-400 hover:bg-zinc-100 hover:text-zinc-800 dark:text-zinc-400 dark:hover:bg-white/20 dark:hover:text-white"
            x-on:click="turn(link)"
            x-text="link"
          ></button>
        </template>
      </div>
    </template>

    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-[6px] text-zinc-400 enabled:hover:bg-zinc-100 enabled:hover:text-zinc-800 disabled:text-zinc-300 sm:size-6 dark:text-zinc-400 dark:enabled:hover:bg-white/20 dark:enabled:hover:text-white dark:disabled:text-zinc-500"
      x-on:click="turn(page + 1)"
      x-bind:disabled="page >= pages"
      aria-label="Next &amp;raquo;"
    >
      <svg class="shrink-0 [:where(&amp;)]:size-4 rtl:hidden" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
</svg>

              <svg class="shrink-0 [:where(&amp;)]:size-4 hidden rtl:inline" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
</svg>

            </button>
  </div>
</div>
  </section>
    </div>

  
  <script src="../../../../../assets/static.js?v=be69322f0f"></script>
