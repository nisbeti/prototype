<script>
    window.Flux = {
        applyAppearance (appearance) {
            let applyDark = () => document.documentElement.classList.add('dark')
            let applyLight = () => document.documentElement.classList.remove('dark')

            if (appearance === 'system') {
                let media = window.matchMedia('(prefers-color-scheme: dark)')

                window.localStorage.removeItem('flux.appearance')

                media.matches ? applyDark() : applyLight()
            } else if (appearance === 'dark') {
                window.localStorage.setItem('flux.appearance', 'dark')

                applyDark()
            } else if (appearance === 'light') {
                window.localStorage.setItem('flux.appearance', 'light')

                applyLight()
            }
        }
    }

    window.Flux.applyAppearance(window.localStorage.getItem('flux.appearance') || 'system')
</script>

u, Glory be to You; indeed, I have been of the wrongdoers. No one calls upon it in distress except that Allah relieves their distress.\"","fr":"Tafrij al-kurub sharh hadith da'wat akhi dhi al-nun la ilaha illa anta subhanaka inni kuntu min al-zalimin ma da'a biha makrub illa farraj Allah kurbatahu (Soulager les afflictions : commentaire du hadith de l'invocation de mon frère Dhul-Nun : « Il n’y a de divinité que Toi, gloire à Toi ! J’étais vraiment du nombre des injustes » ; aucun affligé ne l’invoque sans qu’Allah ne le soulage)","es":"Tafrij al-kurub sharh hadith da'wat akhi dhi al-nun la ilaha illa anta subhanaka inni kuntu min al-zalimin ma da'a biha makrub illa farraj Allah kurbatahu [Alivio de las aflicciones: comentario del hadiz sobre la súplica de mi hermano Dhul-Nun: «No hay más dios que Tú. ¡Gloria a Ti! En verdad, he sido de los injustos»; nadie afligido la pronuncia sin que Allah alivie su aflicción]","ur":"تفريج الكروب شرح حديث دعوة أخي ذي النون لا إله إلا أنت سبحانك إني كنت من الظالمين مادعا بها مكروب إلا فرج الله كربته (غموں کا ازالہ: ذوالنون کے بھائی کی دعا والی حدیث کی شرح: تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ظالموں میں سے تھا؛ جو بھی غم زدہ اس دعا کے ذریعے فریاد کرتا ہے، اللہ اس کی تکلیف دور فرما دیتا ہے)","tr":"Gamların Giderilmesi: Zünnûn Kardeşimizin “Senden başka ilah yoktur; seni tenzih ederim. Ben zalimlerden oldum” duasına dair hadis şerhi; bu duayla dua eden her sıkıntılı kişinin Allah sıkıntısını giderir","sw":"Kuondoa huzuni: Ufafanuzi wa hadithi ya dua ya ndugu yangu Dhun-Nun: Hakuna mungu ila Wewe, umetakasika; hakika mimi ni miongoni mwa madhalimu. Hakuna mwenye dhiki aliyeomba kwa dua hii isipokuwa Allah humuondolea dhiki yake","id":"Tafrij Al-Kurub (Menghilangkan Kesusahan): Penjelasan Hadis Doa Saudaraku Dzun Nun: “Tidak ada Tuhan selain Engkau. Mahasuci Engkau, sungguh aku termasuk orang-orang zalim.” Tidaklah seorang yang ditimpa kesusahan berdoa dengannya, kecuali Allah menghilangkan kesusahannya","ja":"苦悩を取り除く――「ズンヌーンの兄弟の祈り」のハディース注釈。「あなたのほかに神はありません。あなたに称賛あれ。私は不義をなす者でした」と苦しむ者が祈れば、アッラーはその苦悩を取り除かれる","zh":"《消解忧患：阐释“吾兄佐农的祈祷”圣训——“除你之外，绝无应受崇拜者；赞颂你超绝万物，我确是不义者。”忧患之人只要如此祈祷，真主必为他消除忧患》","ru":"Избавление от печалей: комментарий к хадису о мольбе брата Зун-Нуна: «Нет божества, кроме Тебя. Пречист Ты! Поистине, я был из числа несправедливых» — всякий огорчённый, произносивший её, получал от Аллаха избавление от своей скорби","bn":"দুঃখ-কষ্ট দূরীকরণ: যুন-নুনের দোয়ার হাদিসের ব্যাখ্যা—‘আপনি ছাড়া কোনো উপাস্য নেই, আপনি পবিত্র; নিশ্চয়ই আমি জালিমদের অন্তর্ভুক্ত ছিলাম’; কোনো বিপদগ্রস্ত ব্যক্তি এ দোয়া করলে আল্লাহ তার বিপদ দূর করেন","pt":"Tafrij al-kurub: sharh hadith da'wat akhi dhi al-nun, la ilaha illa anta subhanaka inni kuntu min al-zalimin; ma da'a biha makrub illa farraj Allah kurbatahu (Alívio das aflições: comentário ao hadith da súplica do irmão de Dhun-Nun)","hi":"तफ़रीज अल-कुरूब (कष्टों का निवारण): ज़ुन्नून के भाई की दुआ वाली हदीस की व्याख्या—ला इलाहा इल्ला अंता, सुब्हानका इन्नी कुंतु मिन अज़-ज़ालिमीन; जो भी कष्टग्रस्त व्यक्ति यह दुआ करता है, अल्लाह उसका कष्ट दूर कर देता है"},"type":"كتاب","types":{"en":"Book","fr":"Livre","es":"Libro","ur":"کتاب","tr":"Kitap","sw":"Kitabu","id":"Buku","ja":"書籍","zh":"书籍","ru":"Книга","bn":"বই","pt":"Livro","hi":"पुस्तक"},"authors":[{"name":"تقي الدين أحمد بن تيمية الحراني","names":{"en":"Taqi al-Din Ahmad ibn Taymiyyah al-Harrani","fr":"Taqi al-Din Ahmad ibn Taymiyyah al-Harrani","es":"Taqi al-Din Ahmad ibn Taymiyyah al-Harrani","ur":"تقي الدين أحمد بن تيمية الحراني","tr":"Takıyyüddin Ahmed b. Teymiyye el-Harrânî","sw":"Taqi al-Din Ahmad bin Taymiyyah al-Harrani","id":"Taqiyuddin Ahmad bin Taimiyah Al-Harrani","ja":"タキー・アッ＝ディーン・アフマド・イブン・タイミーヤ・アル＝ハッラーニー","zh":"塔基丁·艾哈迈德·本·泰米叶","ru":"Таки ад-Дин Ахмад ибн Таймийя аль-Харрани","bn":"তাকিউদ্দিন আহমাদ ইবনে তাইমিয়্যাহ আল-হাররানি","pt":"Taqi al-Din Ahmad ibn Taymiyyah al-Harrani","hi":"तक़ियुद्दीन अहमद इब्न तैमिय्या अल-हर्रानी"},"href":"authors/000/48.html"}],"died":null,"living":false,"era":"unknown","catego
