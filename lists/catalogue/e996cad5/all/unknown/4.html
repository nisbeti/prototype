<script>
    window.Flux = {
        applyAppearance (appearance) {
            let applyDark = () => document.documentElement.classList.add('dark')
            let applyLight = () => document.documentElement.classList.remove('dark')

            if (appearance === 'system') {
                let media = window.matchMedia('(prefers-color-scheme: dark)')

                window.localStorage.removeItem('flux.appearance')

                media.matches ? applyDark() : applyLight()
            } else if (appearance === 'dark') {
                window.localStorage.setItem('flux.appearance', 'dark')

                applyDark()
            } else if (appearance === 'light') {
                window.localStorage.setItem('flux.appearance', 'light')

                applyLight()
            }
        }
    }

    window.Flux.applyAppearance(window.localStorage.getItem('flux.appearance') || 'system')
</script>

  <script>
    (function () {
      var get = function (key) {
        try {
          return localStorage.getItem('bahith.' + key);
        } catch (error) {
          return null;
        }
      };
      var languages = window.BAHITH_I18N || {};
      var language = get('language');
      if (!languages[language]) {
        var wanted = (navigator.language || 'ar').slice(0, 2);
        language = languages[wanted] ? wanted : 'ar';
      }
      var root = document.documentElement;
      root.lang = language;
      root.dir = get('direction') || (languages[language] ? languages[language].dir : 'rtl');
      root.dataset.arabicFont = get('arabic-font') || 'amiri';
      // The fonts every page draws in, fetched at once rather than once the stylesheet asks, so the first page does
      // not move as they arrive. Only over http(s): a font preload is a CORS request, which a page opened from the disk
      // has no origin to make, so there it would only log errors.
      var arabicFonts = {
        amiri: 'amiri-arabic-400-normal',
        sans: 'noto-sans-arabic-arabic-400-normal',
        indopak: 'indopak-nastaleeq',
        uthmani: 'uthmanic-hafs',
      };
      var fonts = /^https?:$/.test(location.protocol)
        ? [
            'inter-latin-400-normal',
            'inter-latin-500-normal',
            arabicFonts[root.dataset.arabicFont] || arabicFonts.amiri,
          ]
        : [];
      fonts.forEach(function (font) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = '';
        link.href = root.dataset.root + 'assets/fonts/' + font + '.woff2';
        document.head.appendChild(link);
      });
      var quranFont = get('quran-font');
      root.dataset.quranFont = ['uthmani', 'indopak', 'amiri'].indexOf(quranFont) >= 0 ? quranFont : 'uthmani';
      var scale = parseInt(get('content-scale'), 10);
      if (scale >= 80 && scale <= 150) root.style.setProperty('--content-scale', scale / 100);
      if (get('reading-mode') === '1') root.setAttribute('data-reading-mode', '');
      if (get('passage-marks') === 'off') root.setAttribute('data-hide-passages', '');
      // The browser drops the crossfade from page to page (static.css) when a page is slow to draw, or is left while it
      // fades, and rejects its promises, which nothing else holds: settled here, so the console stays clear.
      var settle = function (event) {
        var transition = event.viewTransition;
        if (transition) {
          [transition.ready, transition.updateCallbackDone, transition.finished].forEach(function (promise) {
            promise.catch(function () {
              return null;
            });
          });
        }
      };
      window.addEventListener('pageswap', settle);
      window.addEventListener('pagereveal', settle);
      // The page is written in English: hidden until static.js has put the reader's language in place, or a moment.
      if (language !== 'en') {
        root.setAttribute('data-translating', '');
        setTimeout(function () {
          root.removeAttribute('data-translating');
        }, 1500);
      }
    })();

                    <p class="[:where(&amp;)]:font-normal text-xs [:where(&amp;)]:text-zinc-500 [:where(&amp;)]:dark:text-white/70" dir="auto" x-show="row.sub" x-text="tx(row.subLabel, row.subLabels)" data-flux-text ></p>
</td>

                  <td class="[:where(&amp;)]:py-3 [:where(&amp;)]:px-3 first:ps-0 last:pe-0 text-sm  text-zinc-500 dark:text-zinc-300  not-in-[tr:first-child]:border-t border-zinc-800/10 dark:border-white/20 hidden align-top whitespace-nowrap lg:table-cell" data-flux-cell>
    <span
                      class="inline-flex items-center rounded-md px-1.5 py-0.5 text-xs font-medium"
                      x-bind:class="
                        row.living
                          ? 'bg-emerald-400/15 text-emerald-700 dark:bg-emerald-400/40 dark:text-emerald-200'
                          : 'bg-zinc-400/15 text-zinc-700 dark:bg-zinc-400/40 dark:text-zinc-200'
                      "
                      x-show="row.died"
                      x-text="died(row)"
                    ></span>
</td>

                  <td class="[:where(&amp;)]:py-3 [:where(&amp;)]:px-3 first:ps-0 last:pe-0 text-sm  text-zinc-500 dark:text-zinc-300  not-in-[tr:first-child]:border-t border-zinc-800/10 dark:border-white/20 hidden align-top whitespace-nowrap lg:table-cell" data-flux-cell>
    <span
                      dir="auto"
                      x-text="tx(row.published, row.publishedTranslations)"
                    ></span>
</td>

                  <td class="[:where(&amp;)]:py-3 [:where(&amp;)]:px-3 first:ps-0 last:pe-0 text-sm  text-zinc-500 dark:text-zinc-300  not-in-[tr:first-child]:border-t border-zinc-800/10 dark:border-white/20 hidden align-top lg:table-cell" data-flux-cell>
    <span x-text="row.pages ?? ''"></span>
</td>
</tr>
              </template>
</tbody>
        </table>
    </ui-table-scroll-area>

    

    </div>

          <div
  class="@container flex items-center justify-between gap-3 border-t border-zinc-100 pt-3 dark:border-zinc-700"
  x-show="total > 0"
  data-flux-pagination
>
  <div class="text-xs font-medium whitespace-nowrap text-zinc-500 dark:text-zinc-400">
    Showing
    <span x-text="(page - 1) * perPage + 1"></span>
    to
    <span x-text="Math.min(page * perPage, total)"></span>
    of
    <span x-text="total"></span>
    results
  </div>

  <div
    class="flex items-center rounded-[8px] border border-zinc-200 bg-white p-[1px] dark:border-white/10 dark:bg-white/10"
    x-show="pages > 1"
  >
    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-[6px] text-zinc-400 enabled:hover:bg-zinc-100 enabled:hover:text-zinc-800 disabled:text-zinc-300 sm:size-6 dark:text-zinc-400 dark:enabled:hover:bg-white/20 dark:enabled:hover:text-white dark:disabled:text-zinc-500"
      x-on:click="turn(page - 1)"
      x-bind:disabled="page <= 1"
      aria-label="&amp;laquo; Previous"
    >
      <svg class="shrink-0 [:where(&amp;)]:size-4 rtl:hidden" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
</svg>

              <svg class="shrink-0 [:where(&amp;)]:size-4 hidden rtl:inline" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
</svg>

            </button>

    <template
      x-for="(link, index) in pageLinks"
      :key="index"
    >
      <div class="hidden @[40rem]:contents">
        <template x-if="link === '...'">
          <div
            class="flex size-6 cursor-default items-center justify-center rounded-[6px] text-xs font-medium text-zinc-400 dark:text-zinc-400"
          >
            ...
          </div>
        </template>
        <template x-if="link === page">
          <div
            aria-current="page"
            class="flex h-6 cursor-default items-center justify-center rounded-[6px] px-2 text-xs font-medium text-zinc-800 dark:text-white"
            x-text="link"
          ></div>
        </template>
        <template x-if="link !== '...' && link !== page">
          <button
            type="button"
            class="h-6 rounded-[6px] px-2 text-xs font-medium text-zinc-400 hover:bg-zinc-100 hover:text-zinc-800 dark:text-zinc-400 dark:hover:bg-white/20 dark:hover:text-white"
            x-on:click="turn(link)"
            x-text="link"
          ></button>
        </template>
      </div>
    </template>

    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-[6px] text-zinc-400 enabled:hover:bg-zinc-100 enabled:hover:text-zinc-800 disabled:text-zinc-300 sm:size-6 dark:text-zinc-400 dark:enabled:hover:bg-white/20 dark:enabled:hover:text-white dark:disabled:text-zinc-500"
      x-on:click="turn(page + 1)"
      x-bind:disabled="page >= pages"
      aria-label="Next &amp;raquo;"
    >
      <svg class="shrink-0 [:where(&amp;)]:size-4 rtl:hidden" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
</svg>

              <svg class="shrink-0 [:where(&amp;)]:size-4 hidden rtl:inline" data-flux-icon xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" data-slot="icon">
  <path fill-rule="evenodd" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/>
</svg>

            </button>
  </div>
</div>
        </div>
      </div>
    </div>
  </section>
    </div>

  
  <script src="../../../../../assets/static.js?v=be69322f0f"></script>
</body>
