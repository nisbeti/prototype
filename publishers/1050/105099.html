<script>
    window.Flux = {
        applyAppearance (appearance) {
            let applyDark = () => document.documentElement.classList.add('dark')
            let applyLight = () => document.documentElement.classList.remove('dark')

            if (appearance === 'system') {
                let media = window.matchMedia('(prefers-color-scheme: dark)')

                window.localStorage.removeItem('flux.appearance')

                media.matches ? applyDark() : applyLight()
            } else if (appearance === 'dark') {
                window.localStorage.setItem('flux.appearance', 'dark')

                applyDark()
            } else if (appearance === 'light') {
                window.localStorage.setItem('flux.appearance', 'light')

                applyLight()
            }
        }
    }

    window.Flux.applyAppearance(window.localStorage.getItem('flux.appearance') || 'system')
</script>

  <script>
    (function () {
      var get = function (key) {
        try {
          return localStorage.getItem('bahith.' + key);
        } catch (error) {
          return null;
        }
      };
      var languages = window.BAHITH_I18N || {};
      var language = get('language');
      if (!languages[language]) {
        var wanted = (navigator.language || 'ar').slice(0, 2);
        language = languages[wanted] ? wanted : 'ar';
      }
      var root = document.documentElement;
      root.lang = language;
      root.dir = get('direction') || (languages[language] ? languages[language].dir : 'rtl');
      root.dataset.arabicFont = get('arabic-font') || 'amiri';
      // The fonts every page draws in, fetched at once rather than once the stylesheet asks, so the first page does
      // not move as they arrive. Only over http(s): a font preload is a CORS request, which a page opened from the disk
      // has no origin to make, so there it would only log errors.
      var arabicFonts = {
        amiri: 'amiri-arabic-400-normal',
        sans: 'noto-sans-arabic-arabic-400-normal',
        indopak: 'indopak-nastaleeq',
        uthmani: 'uthmanic-hafs',
      };
      var fonts = /^https?:$/.test(location.protocol)
        ? [
            'inter-latin-400-normal',
            'inter-latin-500-normal',
            arabicFonts[root.dataset.arabicFont] || arabicFonts.amiri,
          ]
        : [];
      fonts.forEach(function (font) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = '';
        link.href = root.dataset.root + 'assets/fonts/' + font + '.woff2';
        document.head.appendChild(link);
      });
      var quranFont = get('quran-font');
      root.dataset.quranFont = ['uthmani', 'indopak', 'amiri'].indexOf(quranFont) >= 0 ? quranFont : 'uthmani';
      var scale = parseInt(get('content-scale'), 10);
      if (scale >= 80 && scale <= 150) root.style.setProperty('--content-scale', scale / 100);
      if (get('reading-mode') === '1') root.setAttribute('data-reading-mode', '');
      if (get('passage-marks') === 'off') root.setAttribute('data-hide-passages', '');
      // The browser drops the crossfade from page to page (static.css) when a page is slow to draw, or is left while it
      // fades, and rejects its promises, which nothing else holds: settled here, so the console stays clear.
      var settle = function (event) {
        var transition = event.viewTransition;
        if (transition) {
          [transition.ready, transition.updateCallbackDone, transition.finished].forEach(function (promise) {
            promise.catch(function () {
              return null;
            });
          });
        }
      };
      window.addEventListener('pageswap', settle);
      window.addEventListener('pagereveal', settle);
      // The page is written in English: hidden until static.js has put the reader's language in place, or a moment.
      if (language !== 'en') {
        root.setAttribute('data-translating', '');
        setTimeout(function () {
          root.removeAttribute('data-translating');
        }, 1500);
      }
    })();
  </script>
