    (function () {
      var get = function (key) {

          return null;
        }
      };
      var languages = window.BAHITH_I18N || {};
      var language = get('language');
      if (!languages[language]) {
        var wanted = (navigator.language || 'ar').slice(0, 2);
        language = languages[wanted] ? wanted : 'ar';
      }
      var root = document.documentElement;
      root.lang = language;
      root.dir = languages[language] ? languages[language].dir : 'rtl';
      var theme = get('theme');
      if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      }
      root.dataset.arabicFont = get('arabicFont') || 'amiri';
      root.dataset.quranFont = get('quranFont') || 'uthmani';
      if (get('passages') === 'off') {
        root.dataset.hidePassages = '';
      }
    })();
  </script>
